<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline + internal css only</title>

    <style>
        *{
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }
        .box{
            height: 200px;
            width: 350px;
            margin: 20px;
            border: 2px solid rgb(145, 1, 145);
            border-radius: 15px;
            position: relative;
        }
        .upperRightCorner{
            box-sizing: content-box;
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 10px;
            border: 2px solid white;
            background-color: rgb(158, 158, 158);
            color: white;
            font-size: 15px;
            border-radius: 15px;
        }

        .circle{
            height: 80px;
            width: 80px;
            text-align: center;
            padding:22px;
            position:absolute;
            margin: 60px 0 0 30px;
            background-color: rgb(148, 72, 199);
            border-radius: 50%;
            border: 3px solid rgb(198, 158, 198);
            font-size: 30px;
            color: white;
        }
        
        .text{
            position: absolute;
            margin: 40px 125px;
        }

        p, a{
            margin-block: 7px;
        }

        .numberBox{
            box-sizing: content-box;
            text-align: center;
            position: absolute;
            padding:4px 7px;
            right: 20px;
            bottom: 15px;
            border: 1px dashed white;
            font-size: 11px;
            color: white;
            background-color: black;

        }
        a{
            font-size: small;
            color: rgb(138, 175, 255); 
            display: block;
        }
        
    </style>
</head>


<body>
    <div class="box" style="background: #d452ff;
background: linear-gradient(90deg, rgba(212, 82, 255, 1) 0%, rgba(79, 28, 112, 1) 100%);">

            A

        <div class="text">

                Backendutvecklare
            </p>
            <a style="font-size: small; display: block;" href="mailto:minimithetrain@gmail.com">minimithetrain@gmail.com</a>

        </div>
        <div class="numberBox">
            #001
        </div>
    </div>

background: linear-gradient(90deg, rgba(89, 89, 89, 1) 0%, rgba(0, 0, 0, 1) 100%);">

</body>
