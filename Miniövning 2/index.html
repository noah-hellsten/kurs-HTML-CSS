<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline + internal css only</title>

    <style>
        *{
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }
        .box{
            height: 200px;
            width: 350px;
            margin: 20px;
            border: 2px solid rgb(145, 1, 145);
            border-radius: 15px;
            position: relative;
        }
        .upperRightCorner{
            box-sizing: content-box;
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 10px;
            border: 2px solid white;
            background-color: rgb(158, 158, 158);
            color: white;
            font-size: 15px;
            border-radius: 15px;
        }

        .circle{
            height: 80px;
            width: 80px;
            text-align: center;
            padding:22px;
            margin: 60px 0 0 30px;
            background-color: rgb(164, 101, 201);
            border-radius: 50%;
            border: 3px solid rgb(198, 158, 198);
            font-size: 30px;
            color: white;
        }
        
    </style>
</head>


<body>
    <div class="box" style="background-color: brown;">
        <div class="upperRightCorner">
            INVISIBLE
        </div>
        <div class="circle">
            A

        </div>
        <div class="text">
            <p>AI</p>
            <p>Backendutvecklare</p>
            <a style="display: block;" href="mailto:minimithetrain@gmail.com">minimithetrain@gmail.com</a>
            <a style="display: block;" href="tel:+46766885566">0766-88-55-66</a>

        </div>
        <div class="numberBox">
            #001
        </div>
    </div>

    <div class="box">
        <p>A</p>
    </div>
    <div>

    </div>
</body>
</html>
